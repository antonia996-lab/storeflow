name: Keep Supabase awake

on:
  schedule:
    - cron: "17 12 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            "https://hrlqrvtwiklslkkvxkac.supabase.co/rest/v1/app_state?select=id&limit=1" \
            -H "apikey: sb_publishable_05tsmTypyGcrnWAv0oOmnA_jsoMPyvQ")
          echo "HTTP $code"; cat /tmp/out.txt
          [ "$code" = "200" ]
